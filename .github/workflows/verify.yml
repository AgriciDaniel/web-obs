name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is informational for now: image discovery in the capture pipeline still fails there.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python packages
        run: python -m pip install requests beautifulsoup4 lxml playwright
      - name: Install a browser for the render tests
        run: python -m playwright install chromium
      - run: npm ci
      - name: Run the full check
        run: npm run verify
        env:
          WEB_OBS_PYTHON_BIN: python
